主要修改在 src/scripts/visualize_active.py:16 和 src/scripts/visualize_active.py:147。我把默认假设收成了一套固定预设：

  - 输入 GLB 默认是 Y-up
  - 输入坐标默认认为 x/z in [-1, 1]，y in [0, 1]
  - 进入环境后仍然走原来的 Y-up -> Z-up 旋转，所以内部等价成 x/y in [-1, 1]，z in [0, 1]
  - 默认体素 pitch 设成 2/128 = 0.015625，在这套标准化坐标下对应内部 128 x 128 x 64 的立方体小格子
  - 默认初始高度改成 0.5，不再默认把相机顶到上边界
  - init_pos 默认改成 None，不再强行塞 (0,0,0)，这样环境可以用标准默认和重采样逻辑
  - save-path 默认改成空，不会每次启动都自动落一个 glb_scene.png
  - DepthLinear 继续作为默认深度 buffer

  运行入口现在就是：

  python src/scripts/visualize_active.py /path/to/scene.glb

  另外我顺手修了 GLB 体素缓存校验，在 src/envs/active_mapping_env.py:571 开始会检查 voxel_pitch_arg 和 voxel_max_dim。这意味着你之前按旧配置生成
  的 .voxels.h5 会在首次运行时自动判定失效并重建，不会继续错误复用旧网格。

  我做过的验证有：

  - python -m py_compile src/scripts/visualize_active.py src/envs/active_mapping_env.py
  - python src/scripts/visualize_active.py --help
  - 一个默认配置 smoke test，确认现在只传 glb_path 时，默认确实是 save_path=""、init_pos=None、DepthLinear、标准 voxel pitch

  没有实际打开 GUI 窗口跑一遍，所以交互显示你还需要本机点一次确认。